apiVersion: v1
kind: Namespace
metadata:
  name: quantamkube
  labels:
    app.kubernetes.io/name: quantamkube
    app.kubernetes.io/version: "1.0.0"

---
apiVersion: v1
kind: Secret
metadata:
  name: quantamkube-secrets
  namespace: quantamkube
type: Opaque
stringData:
  database-url: "postgresql://postgres:postgres@postgres:5432/quantamkube"
  nextauth-secret: "change-me-in-production"
  gemini-api-key: "AIzaSy..."
  google-client-id: "your-client-id"
  google-client-secret: "your-client-secret"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: quantamkube
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: quantamkube
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: database-url
        - name: POSTGRES_DB
          value: quantamkube
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quantamkube
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantamkube-app
  namespace: quantamkube
  labels:
    app: quantamkube-app
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quantamkube-app
  template:
    metadata:
      labels:
        app: quantamkube-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - quantamkube-app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: quantamkube-ai:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: database-url
        - name: NEXTAUTH_URL
          value: https://quantamkube.example.com
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: nextauth-secret
        - name: NEXT_PUBLIC_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: gemini-api-key
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: quantamkube-secrets
              key: google-client-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: quantamkube-app
  namespace: quantamkube
  labels:
    app: quantamkube-app
spec:
  selector:
    app: quantamkube-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    name: http
  type: LoadBalancer

---
apiVersion: autoscaling.k8s.io/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quantamkube-app-hpa
  namespace: quantamkube
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quantamkube-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quantamkube-app-pdb
  namespace: quantamkube
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: quantamkube-app
